server:
  port: 18096

spring:
  profiles:
    active: dev
  application:
    name: agent-ticket-platform
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.atp.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打开，方便看 SQL；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# 不要暴露堆栈给前端
server.error.include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: false          # 用 Apifox，不启 Swagger UI
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.atp: debug