<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">智能工单 Agent 平台</title>
  <desc id="desc">深色圆角底、奶油色工单和橙色 AI 星芒组成的品牌图标</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3029"/>
      <stop offset="0.55" stop-color="#272727"/>
      <stop offset="1" stop-color="#1F1F1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(260 252) rotate(90) scale(196)">
      <stop stop-color="#E8833A" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E8833A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticket" x1="162" y1="166" x2="354" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F7E7D8"/>
    </linearGradient>
    <linearGradient id="spark" x1="602" y1="0" x2="0" y2="602" gradientTransform="translate(305 98)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD27A"/>
      <stop offset="0.55" stop-color="#FFB066"/>
      <stop offset="1" stop-color="#E8833A"/>
    </linearGradient>
    <filter id="shadow" x="-28%" y="-28%" width="156%" height="156%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <mask id="ticketMask">
      <rect x="120" y="165" width="272" height="194" rx="44" fill="white"/>
      <circle cx="120" cy="262" r="24" fill="black"/>
      <circle cx="392" cy="262" r="24" fill="black"/>
    </mask>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="116.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="165" width="272" height="194" rx="44" fill="url(#ticket)" mask="url(#ticketMask)"/>
  </g>

  <rect x="166" y="216" width="122" height="19" rx="9.5" fill="#E8833A" fill-opacity=".88"/>
  <rect x="166" y="254" width="178" height="13" rx="6.5" fill="#40372F" fill-opacity=".22"/>
  <rect x="166" y="284" width="142" height="13" rx="6.5" fill="#40372F" fill-opacity=".16"/>

  <path d="M325 258l11 30 30 11-30 11-11 30-11-30-30-11 30-11 11-30Z" fill="#E8833A" fill-opacity=".92"/>
  <path d="M327 122l15 43 43 15-43 15-15 43-15-43-43-15 43-15 15-43Z" fill="url(#spark)"/>
  <circle cx="394" cy="178" r="8" fill="#FFE0A3"/>
</svg>
